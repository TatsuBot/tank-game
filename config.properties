# Tank prototype config - edit these values and relaunch the game.
# Read once at startup from the folder you run the game in (run.sh
# runs from this folder, so this file is the one used).

# World size in pixels. The window shows a 960x640 camera view of it.
worldWidth=1920
worldHeight=1280

# How many AI enemy tanks spawn
enemyCount=3

# How many random cover obstacles are placed (new layout every run).
# Each is sized in 48px terrain tiles: 1x1, 2x1, 2x2, 3x1, and so on.
obstacleCount=12

# How many item caches are scattered on the map.
# Drive near one to pick up a one-shot aux shell (Q or 2 to select it).
cacheCount=5

# Yellow base safe-zone size in 48px tiles. One zone is placed randomly
# each world and stays put for that world. Shots fired from inside it,
# and shots hitting a tank inside it, deal no damage.
baseWidthTiles=4
baseHeightTiles=3

# Fire rate: seconds between shots (lower = faster firing)
playerReloadSeconds=1.2
enemyReloadSeconds=2.1

# Shell speed in pixels per second
shellSpeed=220

# The one-shot aux shell from caches: slower and heavier than standard.
auxShellSpeed=170
auxShellDamage=68

# Tank speeds in pixels per second
playerSpeed=110
enemySpeed=55

# Terrain movement scalars: tank speed is multiplied by the scalar of
# the tile the tank is currently on. 1.0 = normal speed.
grassMovementScalar=1.0
sandMovementScalar=1.0
swampMovementScalar=0.35

# Hit points
playerHealth=100
enemyHealth=100

# Shell damage before the front/side/rear armour multiplier
shellDamage=34

# Leave empty for a different random layout each run.
# Set a number (e.g. 42) to get the same layout every time.
randomSeed=
